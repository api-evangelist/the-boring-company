name: The Boring Company
description: 'The Boring Company is an American infrastructure and tunnel-construction
  company founded by Elon Musk in 2016 that designs and builds underground transportation,
  utility, and freight tunnels to reduce urban traffic congestion. Its Prufrock tunnel-boring
  machines dig low-cost tunnels roughly a mile a week, and its all-electric, zero-emissions
  Loop system carries passengers in Tesla vehicles through those tunnels — the Las Vegas
  Convention Center Loop is its first commercial deployment. The company publishes no
  public developer API, documentation, or SDKs; its web presence is marketing, careers,
  Vegas Loop ticketing, and a merchandise store.'
